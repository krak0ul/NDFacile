services:
  auto-ndf-app:
    image: auto_ndf:ovisocr2
    build: .

    working_dir: /app

    # keep container running without underlying process
    tty: true
    stdin_open: true
    user: "1000:1000"
    volumes:
      - ./img:/app/img
      - ./img_sorted:/app/img_sorted

    # depends_on:
    #   auto-ndf-vllm:
    #     condition: service_healthy

    environment:
      - VLLM_URL=http://auto-ndf-vllm:8000/v1
      - MODEL_NAME=ovisocr2
      
    # Dev things
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true
        # may need to run pip install --editable .

        # rebuild if reqs change
        - action: rebuild
          path: ./pyproject.toml

        # Doesnt seem to work
        - action: rebuild
          path: ./Dockerfile




  auto-ndf-vllm:
    image: vllm/vllm-openai:v0.22.1

    command:
      - --model=ATH-MaaS/OvisOCR2
      - --gpu-memory-utilization=0.8
      # - --gdn-prefill-backend=triton
      - --max-model-len=32768
      - --enforce-eager
      - --served-model-name=ovisocr2

    ports:
      - "8000:8000"
    volumes:
      - hf_models:/root/.cache/huggingface

    # Use host's Nvidia GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    restart: unless-stopped

volumes:
  hf_models: